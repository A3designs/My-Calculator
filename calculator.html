
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

        <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        body {
            padding-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dc3545;
        }

        #card {
            width: 320px;
            padding: 20px;
            background: #212529;
            border: 2px solid black;
            border-radius: 20px;
            box-shadow: 0 10px 25px #0005;
        }

        #display {
            height: 75px;
            font-size: 30px;
            text-align: right;
            margin-bottom: 15px;
        }
        .calc-btn {
            width: 100%;
            height: 55px;
            font-size: 20px;
            font-weight: bold;
        }

        .operator {
            background: #fff;
        }

        .equal {
            background: #fff;
            color: white;
        }
    </style> 
</head>

<body>

    <div id="card">

        <h4 class="text-white text-center mb-3">CALCULATOR</h4>

        <input type="text" id="display"
               class="form-control"
               placeholder="0" readonly>

        <div class="row g-2">

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                       onclick="displayNumber(7)" >7</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                    onclick="displayNumber(8)"   >8</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                    onclick="displayNumber(9)"   >9</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning calc-btn"
                     onclick="displayNumber('*')"  >&#215</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber(4)">4</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber(5)">5</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                       onclick="displayNumber(6)">6</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning calc-btn"
                        onclick="displayNumber('-')">−</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber(1)">1</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                       onclick="displayNumber(2)" >2</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber(3)">3</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning calc-btn"
                        onclick="displayNumber('+')">&#43</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber('00')">00</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                        onclick="displayNumber(0)">0</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light calc-btn"
                       onclick="displayNumber('.')" >.</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning calc-btn text-dark"
                        onclick="displayNumber('/')">&#247</button>
            </div>
            <div class="col-3">
                <button class="btn btn-danger calc-btn"
                        onclick="clearBox()">AC</button>
            </div>

            <div class="col-3">
                <button class="btn btn-success calc-btn"
                       onclick="removeLastItem()" >&#9003</button>
            </div>

            <div class="col-6">
                <button class="btn  btn-secondary calc-btn text-dark"
                      onclick="evaluateExp()"  >&#61</button>
            </div>

        </div>
    </div>

</body>
<script src="./script.js"></script>
</html>
